<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결제 실패 | 선한영어 Sunhan English</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  body{background:#0b0b0b;color:#e9e9e9;font-family:Pretendard,-apple-system,sans-serif;margin:0;text-align:center}
  main{max-width:560px;margin:0 auto;padding:60px 16px}
  h1{font-size:24px;margin-bottom:8px}
  p{color:#a3a3a3;line-height:1.7}
  a{display:inline-block;margin-top:24px;padding:14px 26px;border-radius:12px;background:#A4FA08;color:#000;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<main>
  <h1>결제가 완료되지 않았습니다</h1>
  <p id="msg">결제가 취소되었거나 오류가 발생했습니다.</p>
  <a href="/checkout.html">다시 결제하기</a>
</main>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("message")) document.getElementById("msg").textContent = q.get("message");
</script>

</html>
